<div class="w-100 foot">
    <div class="foot-content">
        <div class="foot-title">
            <img src="logo-mp.png" alt="Miles Logo">
            <p [ngStyle]="{'color': this.textColor}">&copy; Miles Pickull 2025</p>
        </div>
        <nav class="foot-nav">
            <app-btn-clear-line-z [left]="0" [link]="'legal'" [text]="this.lang.legalNotice" [textColor]="textColor" [legalNotice]="true"></app-btn-clear-line-z>
            <app-btn-clear-image-roll [link]="'https://github.com/pirus99'" [text]="'GitHub'" [image]="'img/social/git-hub.svg'" [textColor]="textColor"></app-btn-clear-image-roll>
            <app-btn-clear-image-roll [link]="'mailto:miles@pickull.de'" [text]="'EMail'" [image]="'img/social/mail.svg'" [textColor]="textColor"></app-btn-clear-image-roll>
            <app-btn-clear-image-roll [link]="'#header'" [text]="this.lang.top" [image]="'img/social/arrow-up.svg'" [textColor]="textColor" [scrollSpeed]="550" [modifyScroll]="true" [scrollOffset]="0"></app-btn-clear-image-roll>
        </nav>
    </div>
</div>
